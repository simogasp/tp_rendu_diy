name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Install ant
        run: sudo snap install ant --stable --classic

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt' # Specify the distribution
          java-version: '11' # Specify the Java version

      - name: Build with Makefile
        run: make 

      - name: Run unit tests
        run: make unit-tests

      - name: Build with ant
        run: ant compile

      - name: Run unit tests with ant
        run: ant unit-tests

      # - name: Checkstyle
      #   run: ant dl-checkstyle && ant checkstyle

    #   - name: Run doc
    #     run: make doc