name: Java CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt' # Specify the distribution
          java-version: '11' # Specify the Java version

      - name: Build with Makefile
        run: make 

      - name: Run unit tests
        run: make unit-tests

    #   - name: Run doc
    #     run: make doc